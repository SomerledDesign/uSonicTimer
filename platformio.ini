; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = release
; keep build output and downloaded libraries out of Dropbox (macOS cache folder)
build_dir = ${sysenv.HOME}/Library/Caches/PlatformIO/uSonicTimer/build
libdeps_dir = ${sysenv.HOME}/Library/Caches/PlatformIO/uSonicTimer/libdeps

[env]
;monitor_port  = 
monitor_speed = 115200

[common]
lib_deps_external =
	; for NOKIA 5110 LCD Display
	olikraus/U8g2@^2.35.20

	; for rotary encoder Special for ESP8266
	lennarthennigs/ESP Rotary@^2.0.0

	; for encoder button
	lennarthennigs/Button2@^2.2.2

	; for temperature sensor
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0


[env:release]
platform = espressif8266
board = esp12e
framework = arduino
build_type = release
; for Pogo pins upload, use ck reset method (RTS only, no DTR)
; ck = Adafruit 70 FTDI cable (RTS only, no DTR)
upload_resetmethod = ck
lib_deps = 
	${common.lib_deps_external}


[env:debug]
platform = espressif8266
board = esp12e
framework = arduino
build_type = debug
lib_deps = 
	${common.lib_deps_external}
	

build_flags = -Og -ggdb -g3 -D DEBUG -D WITH_GDB
 
